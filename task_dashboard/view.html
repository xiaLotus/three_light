<!DOCTYPE html>
<html lang="zh-TW" style="height:100%;overflow:hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作管理系統 — 查閱任務</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    [v-cloak]{display:none!important}
    *{box-sizing:border-box;margin:0;padding:0}

    html,body{
      height:100%;overflow:hidden;
      font-family:'Noto Sans TC',sans-serif;
      background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 30%,#312e81 100%);
      color:#fff;
    }

    #app{height:100%;display:flex;flex-direction:column;}

    /* Top bar */
    .topbar{
      flex-shrink:0;
      padding:.75rem 2.5vw;
      display:flex;align-items:center;justify-content:space-between;
      border-bottom:1px solid rgba(255,255,255,.08);
      background:rgba(15,23,42,.4);backdrop-filter:blur(12px);
    }

    /* Content area */
    .content{
      flex:1;min-height:0;
      display:grid;
      grid-template-columns:1fr 2fr;
      gap:1.1rem;
      padding:1.1rem 2.5vw;
      width:90%;margin:0 auto;
    }
    @media(max-width:860px){.content{grid-template-columns:1fr}}

    /* Panels */
    .panel{overflow-y:auto;display:flex;flex-direction:column;gap:.85rem;padding-right:2px}
    .panel::-webkit-scrollbar{width:3px}
    .panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px}

    /* Cards */
    .card{
      background:rgba(15,23,42,.65);backdrop-filter:blur(18px);
      border:1px solid rgba(255,255,255,.13);border-radius:1.1rem;
      padding:1.25rem 1.35rem;flex-shrink:0;
    }

    /* Section title */
    .sec{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
         display:flex;align-items:center;gap:.4rem;margin-bottom:.9rem;
         padding-bottom:.6rem;border-bottom:1px solid rgba(255,255,255,.08)}

    /* Form */
    .flabel{font-size:.68rem;font-weight:700;color:#94a3b8;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.3rem}
    .finput{
      outline:none;background:rgba(255,255,255,.07);color:#fff;
      border:1.5px solid rgba(255,255,255,.15);padding:.55rem .85rem;
      border-radius:.65rem;transition:all .2s;width:100%;font-size:.875rem;font-family:inherit;
    }
    .finput:focus{border-color:rgba(129,140,248,.7);box-shadow:0 0 0 3px rgba(129,140,248,.15);background:rgba(255,255,255,.11)}
    .finput::placeholder{color:rgba(156,163,175,.45)}
    textarea.finput{resize:none}
    select.finput option{background:#0f172a;color:#fff}
    .finput-ro{
      background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);
      border-radius:.65rem;padding:.55rem .85rem;font-size:.875rem;font-weight:600;
    }

    /* Buttons */
    .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1.15rem;
         border-radius:.65rem;font-weight:600;border:none;cursor:pointer;font-family:inherit;font-size:.85rem;transition:all .2s}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn-ghost{background:rgba(255,255,255,.09);color:#e2e8f0;border:1px solid rgba(255,255,255,.18)}
    .btn-ghost:hover{background:rgba(255,255,255,.16)}
    .btn-save{background:linear-gradient(to right,#818cf8,#c084fc);color:#fff;width:100%;justify-content:center;
              box-shadow:0 4px 14px rgba(129,140,248,.3)}
    .btn-save:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 18px rgba(129,140,248,.4)}
    .btn-add{background:linear-gradient(to right,#10b981,#059669);color:#fff;
             box-shadow:0 4px 14px rgba(16,185,129,.25)}
    .btn-add:hover:not(:disabled){transform:translateY(-1px)}

    /* Misc */
    .badge{padding:.2rem .6rem;border-radius:999px;font-size:.72rem;font-weight:600;
           background:rgba(129,140,248,.18);color:#a5b4fc;border:1px solid rgba(129,140,248,.28)}
    .admin-badge{padding:.2rem .65rem;border-radius:999px;font-size:.7rem;font-weight:700;
                 background:rgba(34,211,238,.12);color:#67e8f9;border:1px solid rgba(34,211,238,.28)}
    .tag-overdue{color:#f87171;font-weight:600}
    .tag-today{color:#34d399;font-weight:600}
    .tag-ok{color:#94a3b8}

    /* Nodes */
    .node{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
          border-radius:.8rem;padding:.9rem 1.1rem;transition:all .2s}
    .node:hover{background:rgba(255,255,255,.08);border-color:rgba(129,140,248,.28)}
    .ndot{width:.6rem;height:.6rem;border-radius:50%;background:#818cf8;flex-shrink:0;
          margin-top:.3rem;box-shadow:0 0 0 3px rgba(129,140,248,.2)}
    .ndot.ch{background:linear-gradient(135deg,#818cf8,#c084fc)}
    .ntime{font-size:.7rem;color:#64748b;margin-bottom:.18rem}
    .ntext{font-size:.88rem;color:#e2e8f0;line-height:1.55}
    .nmeta{font-size:.7rem;color:#475569;margin-top:.3rem;display:flex;align-items:center;gap:.5rem}
    .enter-btn{display:inline-flex;align-items:center;gap:.3rem;font-size:.73rem;font-weight:600;
               color:#818cf8;cursor:pointer;padding:.2rem .55rem;border-radius:.4rem;
               border:1px solid rgba(129,140,248,.32);background:rgba(129,140,248,.1);
               transition:all .15s;margin-left:auto;white-space:nowrap}
    .enter-btn:hover{background:rgba(129,140,248,.2);color:#a5b4fc}

    /* Breadcrumb */
    .bc{display:flex;align-items:center;gap:.3rem;flex-wrap:wrap;
        background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
        border-radius:.6rem;padding:.5rem .8rem;margin-bottom:.75rem}
    .bci{font-size:.75rem;color:#94a3b8;cursor:pointer;padding:.18rem .4rem;
         border-radius:.3rem;transition:all .12s;max-width:140px;
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .bci:hover{color:#e2e8f0;background:rgba(255,255,255,.07)}
    .bci.cur{color:#e2e8f0;font-weight:600;cursor:default}
    .bci.cur:hover{background:transparent}
    .bcsep{color:#374151;font-size:.6rem}

    /* Transitions */
    .slide-enter-active,.slide-leave-active{transition:all .2s ease}
    .slide-enter-from{opacity:0;transform:translateX(10px)}
    .slide-leave-to{opacity:0;transform:translateX(-10px)}
    .toast-enter-active,.toast-leave-active{transition:all .3s ease}
    .toast-enter-from{opacity:0;transform:translateX(80px)}
    .toast-leave-to{opacity:0;transform:translateX(20px)}
  </style>
</head>
<body>
<div id="app" v-cloak>

  <!-- ══ Loading ══ -->
  <div v-if="loading" style="height:100%;display:flex;align-items:center;justify-content:center">
    <div style="text-align:center"><i class="fas fa-spinner fa-spin" style="font-size:2.5rem;color:#818cf8;display:block;margin-bottom:.75rem"></i><p style="color:#94a3b8">載入中...</p></div>
  </div>

  <!-- ══ Not found ══ -->
  <div v-else-if="!task" style="height:100%;display:flex;align-items:center;justify-content:center">
    <div class="card" style="text-align:center;max-width:320px">
      <i class="fas fa-triangle-exclamation" style="font-size:2rem;color:#f87171;display:block;margin-bottom:.75rem"></i>
      <p style="color:#cbd5e1;margin-bottom:1.25rem;font-size:.9rem">找不到該任務</p>
      <a :href="backUrl" class="btn btn-ghost">← 返回</a>
    </div>
  </div>

  <!-- ══ Main ══ -->
  <template v-else>

    <!-- Top bar -->
    <div class="topbar">
      <a :href="backUrl" class="btn btn-ghost" style="font-size:.82rem;padding:.45rem .9rem"><i class="fas fa-arrow-left" style="font-size:.7rem"></i>返回</a>
      <div style="display:flex;align-items:center;gap:.75rem">
        <span v-if="isAdmin" class="admin-badge"><i class="fas fa-shield-halved" style="margin-right:.3rem"></i>管理員</span>
        <span style="font-size:1rem;font-weight:700;color:#fff">🔍 查閱任務</span>
        <span style="font-size:.75rem;color:#64748b">{{ task['提案人'] }} · {{ task['日期'] }}</span>
      </div>
    </div>

    <!-- Two-column content -->
    <div class="content">

      <!-- ════ LEFT PANEL ════ -->
      <div class="panel">

        <!-- 基本資訊（可編輯）-->
        <div class="card">
          <div class="sec" style="color:#a5b4fc"><i class="fas fa-pen-to-square" style="font-size:.7rem"></i>基本資訊</div>
          <div style="display:flex;flex-direction:column;gap:.75rem">

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:.65rem">
              <div>
                <div class="flabel">案件分類</div>
                <select v-model="editForm['案件分類']" class="finput">
                  <option v-for="c in caseOptions" :key="c" :value="c">{{ c }}</option>
                </select>
              </div>
              <div>
                <div class="flabel">組織類別</div>
                <select v-model="editForm['組織類別']" class="finput">
                  <option v-for="o in orgOptions" :key="o" :value="o">{{ o }}</option>
                </select>
              </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem">
              <div><div class="flabel">棟別</div><input type="text" v-model="editForm['棟別']" placeholder="A棟" class="finput"></div>
              <div><div class="flabel">樓層</div><input type="text" v-model="editForm['樓層']" placeholder="3F" class="finput"></div>
              <div><div class="flabel">站點</div><input type="text" v-model="editForm['站點']" placeholder="S01" class="finput"></div>
            </div>

            <div>
              <div class="flabel">截止日期</div>
              <input type="date" v-model="editForm['項目Due Date']" class="finput">
            </div>

            <div>
              <div class="flabel">項目描述</div>
              <textarea v-model="editForm['項目描述']" rows="4" class="finput" placeholder="項目描述..."></textarea>
            </div>

          </div>
        </div>

        <!-- 管理員欄位 -->
        <div v-if="isAdmin" class="card">
          <div class="sec" style="color:#67e8f9"><i class="fas fa-shield-halved" style="font-size:.7rem"></i>管理員欄位</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:.65rem">
            <div><div class="flabel">管理OWNER</div><input type="text" v-model="editForm['管理OWNER']" placeholder="主任階管理層" class="finput"></div>
            <div><div class="flabel">項目OWNER</div><input type="text" v-model="editForm['項目OWNER']" placeholder="負責人" class="finput"></div>
            <div><div class="flabel">單項目截止日期</div><input type="date" v-model="editForm['單項目Due Date']" class="finput"></div>
            <div>
              <div class="flabel">距今</div>
              <div class="finput-ro" :class="dueClass(task['距今'])">{{ task['距今']||'無' }}</div>
            </div>
          </div>
        </div>

        <!-- 儲存按鈕 -->
        <button @click="submitEdit" :disabled="editSubmitting" class="btn btn-save">
          <i v-if="editSubmitting" class="fas fa-spinner fa-spin"></i>
          <i v-else class="fas fa-floppy-disk"></i>
          {{ editSubmitting ? '儲存中...' : '儲存所有變更' }}
        </button>

      </div>
      <!-- ════ END LEFT ════ -->

      <!-- ════ RIGHT PANEL ════ -->
      <div class="panel">

        <!-- 新增節點 -->
        <div class="card">
          <div class="sec" style="color:#34d399;font-size:.68rem">
            <i class="fas fa-plus-circle" style="font-size:.7rem"></i>
            <span v-if="currentPath.length===0">新增頂層進度</span>
            <span v-else>在「{{ currentPath.at(-1).text.slice(0,20) }}」下新增子節點</span>
          </div>
          <textarea v-model="newProgress"
            :placeholder="currentPath.length===0?'輸入進度描述...':'輸入子節點內容...'"
            class="finput" rows="3" style="margin-bottom:.75rem"></textarea>
          <div style="display:flex;justify-content:flex-end">
            <button @click="submitProgress" :disabled="progressSubmitting||!newProgress.trim()" class="btn btn-add">
              <i v-if="progressSubmitting" class="fas fa-spinner fa-spin"></i>
              <i v-else class="fas fa-paper-plane"></i>
              {{ progressSubmitting ? '新增中...' : '新增節點' }}
            </button>
          </div>
        </div>

        <!-- 進度節點 -->
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem">
            <div class="sec" style="color:#34d399;margin-bottom:0;border-bottom:none;padding-bottom:0">
              <i class="fas fa-diagram-project" style="font-size:.7rem"></i>進度節點
            </div>
            <span style="font-size:.72rem;color:#64748b;background:rgba(255,255,255,.06);padding:.25rem .7rem;border-radius:999px;border:1px solid rgba(255,255,255,.1)">
              {{ currentLevelNodes.length }} 個節點
              <span v-if="currentPath.length > 0" style="color:#818cf8"> · 第 {{ currentPath.length + 1 }} 層</span>
            </span>
          </div>

          <!-- Breadcrumb -->
          <div v-if="currentPath.length > 0" class="bc">
            <span class="bci" @click="navigateTo(-1)"><i class="fas fa-home" style="font-size:.65rem"></i> 根目錄</span>
            <template v-for="(node, idx) in currentPath" :key="node.id">
              <span class="bcsep"><i class="fas fa-chevron-right"></i></span>
              <span class="bci" :class="idx===currentPath.length-1?'cur':''" @click="navigateTo(idx)">
                {{ node.text.slice(0,18) }}{{ node.text.length>18?'…':'' }}
              </span>
            </template>
            <button @click="goBack" class="btn btn-ghost" style="padding:.28rem .7rem;font-size:.72rem;margin-left:auto;flex-shrink:0">
              <i class="fas fa-arrow-left" style="font-size:.65rem"></i>上層
            </button>
          </div>

          <!-- Node list -->
          <div v-if="loadingProgress" style="padding:2rem;text-align:center;color:#64748b">
            <i class="fas fa-spinner fa-spin" style="margin-right:.5rem"></i>載入中...
          </div>

          <transition name="slide" mode="out-in">
            <div :key="currentPath.map(n=>n.id).join('-')" style="display:flex;flex-direction:column;gap:.6rem">

              <template v-if="currentLevelNodes.length > 0">
                <div v-for="node in currentLevelNodes" :key="node.id" class="node">
                  <div style="display:flex;align-items:flex-start;gap:.75rem">
                    <div class="ndot" :class="node.children?.length>0?'ch':''"></div>
                    <div style="flex:1;min-width:0">
                      <div class="ntime">{{ node.time }}</div>
                      <div class="ntext">{{ node.text }}</div>
                      <div class="nmeta">
                        <span v-if="node.children?.length>0" style="color:#818cf8">
                          <i class="fas fa-sitemap" style="font-size:.65rem;margin-right:.25rem"></i>{{ node.children.length }} 個子項目
                        </span>
                        <span v-else>無子項目</span>
                        <span @click="enterNode(node)" class="enter-btn">
                          進入 <i class="fas fa-chevron-right" style="font-size:.65rem"></i>
                        </span>
                      </div>
                    </div>
                  </div>
                </div>
              </template>

              <div v-else style="padding:2.5rem;text-align:center;color:#475569;border:1px solid rgba(255,255,255,.08);border-radius:.75rem">
                <i class="fas fa-comment-slash" style="font-size:1.5rem;display:block;margin-bottom:.5rem;opacity:.35"></i>
                <p style="font-size:.85rem">此層尚無節點</p>
              </div>

            </div>
          </transition>
        </div>

      </div>
      <!-- ════ END RIGHT ════ -->

    </div>

  </template>

  <!-- ══ Toast ══ -->
  <transition-group name="toast" tag="div" style="position:fixed;top:1.25rem;right:1.25rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem">
    <div v-for="t in toasts" :key="t.id"
         class="card" style="display:flex;align-items:center;gap:.75rem;padding:.75rem 1.1rem;min-width:240px;border-left-width:4px"
         :style="t.type==='success'?'border-left-color:#4ade80':'border-left-color:#f87171'">
      <i :class="t.type==='success'?'fas fa-check-circle':'fas fa-exclamation-circle'"
         :style="t.type==='success'?'color:#4ade80':'color:#f87171'"></i>
      <span style="font-size:.875rem;font-weight:500;flex:1;color:#fff">{{ t.message }}</span>
      <button @click="removeToast(t.id)" style="color:#64748b;background:none;border:none;cursor:pointer;padding:.1rem">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </transition-group>

</div>
<script src="view.js"></script>
</body>
</html>
