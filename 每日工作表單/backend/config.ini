[paths]
# 任務資料 CSV
csv_file     = tasks.csv
# 進度節點 JSON 存放資料夾
progress_dir = progress
# 管理員權限設定檔
admin_file   = admin.json
# 帳號↔姓名對照檔
users_file   = users.json

[logging]
# log 檔資料夾
log_dir      = log
# log 檔名格式（loguru 時間佔位符）
log_file     = app_{time:YYYY-MM-DD}.log
# 每日輪替時間
rotation     = 00:00
# 保留天數
retention    = 90 days

[server]
host  = 127.0.0.1
port  = 5000
debug = false