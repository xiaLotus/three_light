<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登入 · 營運組值班排班管理系統</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Noto Sans TC',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
      background:linear-gradient(135deg,#0a1024 0%,#172040 50%,#0a1024 100%);}
    .card{background:#fff;border-radius:18px;width:100%;max-width:420px;box-shadow:0 25px 80px rgba(0,0,0,.45);overflow:hidden;}
    .card-head{background:linear-gradient(135deg,#0098ff,#00d4ff);padding:28px 32px;color:#001;display:flex;align-items:center;gap:14px;}
    .logo{width:54px;height:54px;border-radius:14px;background:rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;letter-spacing:1px;font-family:'JetBrains Mono',monospace;}
    .title{font-size:20px;font-weight:900;letter-spacing:.5px;}
    .subtitle{font-size:12px;font-weight:600;opacity:.7;margin-top:2px;}
    .card-body{padding:30px 32px 24px;}
    label{font-size:12px;font-weight:700;color:#4a5568;display:block;margin-bottom:6px;}
    .req{color:#e53e3e;}
    input[type=text],input[type=password]{width:100%;background:#f7fafc;border:1.5px solid #e2e8f0;border-radius:10px;padding:12px 14px;font-size:14px;outline:none;transition:border-color .2s;margin-bottom:16px;}
    input:focus{border-color:#0098ff;}
    input[type=password]{font-family:'JetBrains Mono',monospace;letter-spacing:2px;}
    .eng-row{display:flex;align-items:center;gap:8px;margin:2px 0 4px;}
    .eng-row input{width:16px;height:16px;margin:0;cursor:pointer;}
    .eng-row label{margin:0;font-weight:600;color:#718096;cursor:pointer;}
    .err{display:none;color:#e53e3e;font-size:12.5px;font-weight:700;margin-top:4px;background:rgba(229,62,62,.08);border:1px solid rgba(229,62,62,.25);border-radius:8px;padding:9px 11px;line-height:1.5;}
    .btn{width:100%;margin-top:18px;background:linear-gradient(135deg,#0098ff,#00d4ff);color:#001;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:900;cursor:pointer;letter-spacing:2px;box-shadow:0 6px 18px rgba(0,152,255,.3);transition:transform .15s,opacity .15s;}
    .btn:hover{transform:translateY(-1px);}
    .btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
    .foot{text-align:center;font-size:11px;color:#a0aec0;margin-top:16px;line-height:1.6;}
  </style>
</head>
<body>
  <div class="card">
    <div class="card-head">
      <div class="logo">FT</div>
      <div>
        <div class="title">營運組排班系統</div>
        <div class="subtitle">Duty Shift Manager · 登入</div>
      </div>
    </div>
    <div class="card-body">
      <label>工號 <span class="req">*</span></label>
      <input type="text" id="account" placeholder="例：F1234 或 ADM-001" autocomplete="username" maxlength="30" autofocus>

      <label>密碼 <span class="req">*</span></label>
      <input type="password" id="password" placeholder="請輸入密碼" autocomplete="current-password">

      <div class="eng-row">
        <input type="checkbox" id="eng-only">
        <label for="eng-only">以唯讀身分（ENG）登入（不佔用 Leader 編輯權）</label>
      </div>

      <div class="err" id="err"><i class="bi bi-exclamation-triangle-fill me-1"></i><span id="err-text"></span></div>

      <button class="btn" id="login-btn"><i class="bi bi-box-arrow-in-right me-2"></i>登入系統</button>

      <div class="foot">© 2026 營運組值班排班管理系統</div>
    </div>
  </div>

  <script>
    // 與 index.html / app.js 同一個後端入口
    const API_URL = 'http://127.0.0.1:5000/api';

    const $ = id => document.getElementById(id);
    const btn = $('login-btn');

    function showErr(msg){
      $('err-text').textContent = msg;
      $('err').style.display = 'block';
    }
    function clearErr(){ $('err').style.display = 'none'; }

    async function doLogin(){
      clearErr();
      const account  = $('account').value.trim();
      const password = $('password').value;
      const engOnly  = $('eng-only').checked;
      if(!account || !password){ showErr('請輸入工號與密碼'); return; }

      btn.disabled = true;
      const orig = btn.innerHTML;
      btn.innerHTML = '<i class="bi bi-arrow-repeat"></i> 驗證中…';

      try{
        const r = await fetch(API_URL + '?action=auth', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ account, password })
        });
        const d = await r.json();

        // 只有後端回傳 success:true 才放行進入 index.html
        if(r.ok && d && d.success){
          const role = (d.role === 'ADMIN') ? 'ADMIN'
                     : (d.role === 'LEADER') ? 'LEADER' : 'ENG';
          // 勾「以唯讀(ENG)登入」→ 一律 ENG；否則用真實角色（ADMIN/LEADER/ENG）
          const intended = engOnly ? 'ENG' : role;
          sessionStorage.setItem('dsm_login', JSON.stringify({
            account: d.account || account,
            name:    d.name || account,
            role:    role,
            intended: intended,
            loginAt: new Date().toISOString()
          }));
          location.href = 'index.html';
        }else{
          showErr((d && d.message) ? d.message : '工號或密碼錯誤');
          btn.disabled = false; btn.innerHTML = orig;
        }
      }catch(e){
        showErr('無法連線到伺服器，請確認後端已啟動（' + API_URL + '）');
        btn.disabled = false; btn.innerHTML = orig;
      }
    }

    btn.addEventListener('click', doLogin);
    $('password').addEventListener('keypress', e => { if(e.key === 'Enter') doLogin(); });
    $('account').addEventListener('keypress', e => { if(e.key === 'Enter') $('password').focus(); });

    // 進入登入頁時清除舊的登入工作階段 → 可無條件重新登入（換人/重登）
    try{ sessionStorage.removeItem('dsm_login'); }catch(e){}
  </script>
</body>
</html>
